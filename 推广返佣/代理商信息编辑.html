          <p><span style="font-family:'';font-weight:700;">推广佣金计算举例：</span></p><p><span style="font-family:'';font-weight:400;">商户设置：推广人返佣比例为10%，平台佣金2%</span></p><p><span style="font-family:'';font-weight:400;">客人消费100元，则</span></p><p><span style="font-family:'';font-weight:400;">推广人佣金金额=100*10%=10元，（这是车队+司机佣金总和）</span></p><p><span style="font-family:'';font-weight:400;">平台佣金=100*2%=2元，（我们平台收取的服务费，与司机和车队的比例均无关）</span></p><p><span style="font-family:'';font-weight:400;">司机所属代理商（车队）配置：车队占推广佣金比例=20%，则</span></p><p><span style="font-family:'';font-weight:400;">车队佣金=10*20%=2元</span></p><p><span style="font-family:'';font-weight:400;">司机佣金=10*（1-20%）=8元</span></p>
        </div>
